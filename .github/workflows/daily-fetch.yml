name: Daily Egg Price Fetch

on:
  schedule:
    # 每日台灣時間 12:00 (UTC 04:00)
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Fetch egg prices
        run: npm run fetch

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes — skipping commit"
          else
            DATE_TW=$(TZ=Asia/Taipei date +%Y-%m-%d)
            git commit -m "chore(data): daily fetch ${DATE_TW}"
            git push
          fi
